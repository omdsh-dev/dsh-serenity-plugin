# CI — dsh-serenity-plugin（S142 review F-14，v1.30.7；v1.30.16 修复为可绿）
#
# 为什么存在：发布链此前只有 `dsh-develop publish` 的 typecheck + build + pack-check，
# **测试是"人记得跑"的步骤**；仓库也没有任何 CI，于是 1000+ 个测试形同建议。
# 本工作流在每次 push/PR 上跑测试，把"绿着发布带红测试"挡在门外。
#
# ── v1.30.16 修复：为什么从 npm 换成 pnpm（根因，实证）──────────────────────────
# 旧版用 `npm install`，CI **13 次运行全红**：job 步骤级证据 = checkout/setup-node 成功 →
# `Install dev dependencies` 失败 → 之后 typecheck/test 全部 skipped；耗时仅 **6 秒**，
# 即失败在下载之前的**依赖解析**阶段。根因三层（全部本地等价复现，公网 registry）：
#   ① `npm install --dry-run` → `npm error Cannot read properties of null (reading 'edgesOut')`
#   ② 逐字段/逐包二分：`minimal`/`peers-only` PASS、`dev-only` FAIL；单装 11 个 devDep →
#      **只有 `tsdown@^0.22.14` FAIL**
#   ③ 上游定性 = **npm/cli issue #9787**（open）：arborist `#loadPeerSet`
#      （build-ideal-tree.js:1289/1297）**未判空的 null 解引用**；触发形态 =
#      "自引用同版本 + 通配符"的**可选 peer 集合**——tsdown@0.22.14 正是（可选 peers
#      `@tsdown/css:"0.22.14"`、`@tsdown/exe:"0.22.14"` + `tsx:"*"` 等 9 项）。
#      CI 是 Node 22 → 自带 npm 10.x，正是 issue 里崩溃的版本。
#   实测绕法：`--legacy-peer-deps` / npm 11 可避开崩溃，但前者跳过 peer 安装 → 不可取。
# 本仓本就是 **pnpm 项目**（hooks 自带 `pnpm-lock.yaml`、根 `packageManager: pnpm@9.0.0`），
# 用 npm 装属包管理器错配（且无锁文件 → 每次全量解析，正撞上这个 bug）。改用 pnpm 后解析
# 由 pnpm 负责（不经过 arborist），且**版本锁定、可复现**。
#
# 顺带修复（否则 `--frozen-lockfile` 也会失败）：`hooks/dsh-serenity-hooks/pnpm-lock.yaml`
# **与 package.json 不一致**——18 个 `peerDependencies`（`@deepseek-ai/dsh-*` / `cordis` /
# `@deepseek-ai/cordis` / `schemastery`）只在 package.json 里、锁文件没有（加了 peer 但没重跑
# pnpm）→ 已 `pnpm install --lockfile-only` 重新生成（68 KB → 122 KB，18 个 peer 均可解析到
# `0.1.2-rc.1`）。**今后改 package.json 依赖后必须重跑 pnpm install 并提交锁文件。**
#
# ── typecheck 基准（v1.31.11 已修好）+ 本 workflow 的定位（D52 用户裁决）─────────────
# 旧形态（v1.30.7~v1.31.10）：两个 tsconfig 的 `paths` 指向**开发机上的宿主类型基准**
#   （`/home/yh/.npm-global/…/dsh/node_modules/@deepseek-ai/*` + `/home/yh/.dsh/source/…`）
#   → runner 上全不存在，tsc 静默回落，实测 node 半 **94 条错误**（主因 `cordis` 与
#   `@deepseek-ai/cordis` 两个包实例 → Context 声明合并失效）→ 只能设 `continue-on-error`。
#
# v1.31.11 已把基准改成**仓库内可解析**：32 个宿主包进 hooks 的 devDependencies（精确
# `0.1.5-rc.1`）+ paths 改 `node_modules/@deepseek-ai/*` + cordis 双映射同一实体；
# 闸门 `tests/compliance.test.ts` F7。**实证（run #39）**：runner 上两个 typecheck 步
# = success，check-run 注解 **21 条 → 1 条**（唯一剩余 = Node 20 弃用提示）。
#
# ⚠️ **D52（2026-09-10 用户裁决）**："我对 github ci 持反对态度，如果有什么是需要检查的，
#    请在我们发布机制里检查" → 本 workflow 从"每次 push 自动跑"改为**仅手动触发**
#    （`workflow_dispatch`）；**质量门归发布链** `dsh-develop publish`：
#      锁文件一致（verifyLockfile）→ 测试（test 内含 typecheck 双面）→ 构建 → README 同步 → tarball 核对
#    各步仍保留 `continue-on-error`：手动跑时它是**一次性诊断**，不阻塞、不发失败邮件。
#    若将来要恢复自动触发：把 `on:` 加回 `push: branches: [master, main]` 即可（历史见 CHANGELOG v1.31.11）。
#
# 本地等价命令（= 发布链的手工调用）：
#   msm("dsh-develop", ["test"])        # vitest（根配置覆盖 tests/ + hooks/**/tests/ + scripts/）+ typecheck 双面
#   msm("dsh-develop", ["lockfile"])    # 锁文件重算 + 与 publish 前置同一函数的一致性判定

name: CI

# D52（2026-09-10 用户裁决）：GitHub CI 不是我们的质量门 → **仅手动触发**。
# 质量门 = 发布链 `dsh-develop publish`（锁文件一致 → test 含 typecheck 双面 → build → tarball 核对）。
# 恢复自动触发 = 加回：
#   push:
#     branches: [master, main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    name: test (hooks + root) + typecheck (manual diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本**单一真相源** = 根 package.json 的 `packageManager`（本机实测 11.20.0；
      # 锁文件 lockfileVersion 9.0）。**不要**在这里再传 version —— action-setup@v4 见到
      # 两处版本会直接报 "Multiple versions of pnpm specified"（run #14 实证）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            hooks/dsh-serenity-hooks/pnpm-lock.yaml

      # 两个独立 pnpm 项目：仓库根（tests/ + scripts/）与 hooks 包（hooks/**/tests/）。
      # 根 vitest 配置同时收集两者，故两个都要装。--frozen-lockfile：锁文件与
      # package.json 不一致即失败（防 CI 静默漂移）。
      #
      # 为什么带 `--ignore-scripts`（两处实证，run #15 / 本地冷 store 复现）：
      #   ① **构建脚本批准**：pnpm 10+ 对未批准的依赖构建脚本**硬失败**
      #      （`ERR_PNPM_IGNORED_BUILDS: esbuild@0.21.5, esbuild@0.28.1`）→ 根安装 exit 1。
      #      esbuild 的平台二进制由 optional dep 提供，脚本非必需——实测跳过脚本后
      #      986 + 1044 用例全绿。
      #   ② **prepare 生命周期**：hooks 的 `prepare`（tsdown + `tsc --emitDeclarationOnly`）
      #      依赖两个 tsconfig 的**本机硬编码 paths**（见文件头），在 runner 上必然失败
      #      → hooks 安装 exit 2。CI 只需要**测试**，不需要构建产物。
      # 两者都由 `--ignore-scripts` 一并解决；构建/类型门仍在本地发布链
      # （`dsh-develop publish` = test + typecheck 双面 + build + pack-check）。
      # ⚠️ v1.31.11：两个 Install 步也加 `continue-on-error`——**必须在 Test 之前**就兜住：
      # 实测 #31 那类失败（hooks 锁文件漂移）就发生在 Install 阶段，只给 Test 加守卫覆盖不到它，
      # 照样会发失败邮件。装配失败时 Test 仍会跑并以同样方式降级（deps 缺失 → 测试红 → 注解）。
      - name: Install (repo root)
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install (hooks)
        continue-on-error: true
        working-directory: hooks/dsh-serenity-hooks
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 测试（v1.31.11：由**阻塞门**降为**信息性**——见文件头「为什么测试不再阻塞」）
      #
      # v1.31.4：tee 到日志文件 + **`set -o pipefail`**（必须——否则管道退出码取自 tee，
      # vitest 红而 step 绿，失败原文会丢）。日志供下一步转注解用。
      - name: Test
        id: test
        # continue-on-error：测试红**不再让 run 变 failure** → GitHub 不再发失败邮件（用户诉求）；
        # 失败原文仍由下一步转成 annotation（免认证可读，agent 用 annotations API 取证）。
        # 要恢复阻塞语义：删掉这一行（+ 下一行注释所提的 `if:` 保持可用，两者兼容）。
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      # 失败原文可读（v1.31.4 排障沉淀）：job log 需 admin 权限（匿名 `…/logs` → 403），
      # 而 **workflow command 产生的 annotation 免认证可读**
      # （`GET /repos/<owner>/<repo>/check-runs/<id>/annotations`）。本步把 vitest 的失败摘要
      # 转成 `::error` 注解——排查者无需仓库权限即可看到失败用例名与断言差异。
      # 触发背景：v1.31.2~v1.31.4 连续三轮 CI 只报 "Test step exit code 1"，无法定位。
      # ⚠️ v1.31.11：Test 步加了 `continue-on-error` → job 状态恒 success，`if: failure()`
      # **永不成立**（会静默丢失失败原文）→ 改判**上一步的 outcome**。
      - name: Test failure digest (annotations)
        if: steps.test.outcome == 'failure'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/vitest.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=vitest-digest::no vitest log captured (Test step failed before vitest ran)"
            exit 0
          fi
          # 失败摘要：优先 "Failed Tests" 段（含用例名 + 断言 diff），否则取日志末尾
          SUMMARY="$(sed -n '/Failed Tests/,$p' "$LOG" | head -c 4000)"
          [ -n "$SUMMARY" ] || SUMMARY="$(tail -c 4000 "$LOG")"
          TAIL="$(tail -n 12 "$LOG")"
          esc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          echo "::error title=vitest-summary::$(printf '%s' "$TAIL" | esc)"
          echo "::error title=vitest-failure-digest::$(printf '%s' "$SUMMARY" | esc)"
          echo "----- full vitest log (admins) -----"
          cat "$LOG"

      # 信息性：宿主类型基准是本机路径（见文件头「为什么 typecheck 是信息性」）
      - name: Typecheck (node half, informational)
        continue-on-error: true
        working-directory: hooks/dsh-serenity-hooks
        run: pnpm run typecheck

      - name: Typecheck (client half, informational)
        continue-on-error: true
        working-directory: hooks/dsh-serenity-hooks
        run: pnpm exec tsc -p client/tsconfig.json --noEmit

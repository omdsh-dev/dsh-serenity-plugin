# bench/profile-patch.yml — 集成测试台的 profile patch（**默认模型的指向**）
#
# 它解决什么麻烦（白话）：测试台的容器里默认用的模型是"镜像里写死的那一个"，而那个模型
#   容器里没有凭据 ⇒ 每一条真实对话轮都以 `MISSING_CREDENTIAL` 结束 ⇒ 测不了"功能可用"。
#   本文件把容器的默认模型改成**我们真有凭据的那个**（MiniMax M3）。
#
# 🔴 **本文件刻意不含任何密钥**（与约束文档 §5.4-5 一致：key 只能运行时注入，不得进任何层）。
#   路由用 `apiKeyEnv` **引用**环境变量名；真实值由 `bench-docker up` 在 `docker run` 时注入。
#   逐字形状抄自**本机真实 profile patch**（`~/.dsh/profiles/web/cordis.patch.yml`，2026-09-25 取证），
#   差别只有两处、且都是**刻意**的：
#     ① 路由名 `minimax-bench`（本机叫 `minimax-cn-coding-plan`）—— 让容器里的路由在日志里**一眼可辨**；
#     ② 用 `apiKeyEnv: MINIMAX_BENCH_API_KEY` 取代本机的**内联 `apiKey:`** —— 内联 = 密钥进文件，禁止。
#
# 落地方式（三者缺一不可，见 bench/entrypoint.sh 与 bench-docker 的 cmdUp）：
#   本文件 → 推到远端 `/opt/dsh-bench/dist/bench-profile-patch.yml` → 挂进容器 `/ccc/profile-patch.yml:ro`
#   → entrypoint 在起宿主**之前** `cp` 到 `/root/.dsh/profiles/web/cordis.patch.yml`。
#   ⚠️ patch 语义 = **按 id 定位整体替换**该条目 config（**不深合并**）⇒ 每个条目要写全它的字段。
#
# 两个条目（第 ⑥ 项改动点的「键 A / 键 B」，见 docs/dsp-module-map.md §2.9）：
#   键 A = `llm-pi-ai` 的 `config.providers.<route>`：目录外路由必须给 `api` + `baseURL` + **非空 models**。
#   键 B = `agent-default-model` 的 `config.provider` / `config.model`：宿主只吃这个做每轮默认。
- id: llm-pi-ai
  config:
    providers:
      minimax-bench:
        api: openai-completions
        baseURL: https://api.minimaxi.com/v1
        apiKeyEnv: MINIMAX_BENCH_API_KEY
        models:
          - id: MiniMax-M3
            contextWindow: 1024000
            maxTokens: 64000
            # 🔴 v1.51.1 修正（**保真度**，不是放宽判据）：原为 `input: []` —— 那等于把这条路由
            #    声明成"**不收图**"，于是 `diagram` 只可能走**降级落盘**分支、"图进对话"这一格
            #    **结构性验不到**（实测：工具如实回「当前模型路由未声明图像输入」并把 PNG 落盘）。
            #    而本机真实路由（`minimax-cn` 的 MiniMax-M3）声明的是 `[text, image]` ⇒ 容器里也该一致，
            #    否则测试台验的是一个**线上不存在的形态**。
            input:
              - text
              - image
            compat: {}
        retryPolicy:
          mode: normal
          maxRetries: 100
- id: agent-default-model
  config:
    provider: minimax-bench
    model: MiniMax-M3

# ── 第三条目（v1.51.1）：把 diagram 工具**打开** ──────────────────────────────
# 为什么必须在这里开（而不是等容器里的模型去拨面板）：`diagram` 是**缺省关**的实验性工具，
# 关时**不注册** ⇒ 容器里根本没有这个工具，V10~V14 全部无从谈起。
# 🔴 patch 语义 = **按 id 整体替换该条目 config**（不深合并）⇒ 没写的字段回落到 schema 缺省，
#    与"完全没有这个条目"等价 ⇒ 只写我们要改的那一个键即可。
# 🔴 这一条同时**顺带验了 v1.51.1 的部署层通路**：开关经 `readSimpleSettings()` 读
#    （优先级 面板层 > 部署层 > 内建缺省），而"宿主写配置要不要重启才生效"正是本版修的缺陷。
- id: serenity-hooks
  name: "@shgroup/dsh-serenity-hooks"
  config:
    diagramEnabled: true
    # ── 第四条目（2026-10-16）：把**面 E（官方 ACP）打开** ──────────────────────
    # 为什么必须在这里开（而不是等容器里的模型去拨面板）：面 E 是**缺省关**的面，
    # 关时 `registerAcpFace` 的 sync 直接 return ⇒ 容器里**根本没有监听器** ⇒ A1~A5 全组无从谈起。
    # 🔴 **键名是 `acpFaceEnabled`，不是 `acpEnabled`** —— 后者是**已退役旧面 E（3100）**的名字，
    #    现被静默忽略（本仓 `tests/config-volatile.test.ts` 有独立的"旧名不得复活"回归钉）。
    #    写错键名的症状 = 面永远起不来，而**没有任何报错**（只会在 A1 红，且原因看起来像"代码坏了"）。
    # 🔴 本面绑 `0.0.0.0`（端口表 `FACE_PORTS.acp.host`，owner Q3 裁决）—— 在**容器里**这没有暴露问题
    #    （容器网络隔离），这也正是"面 E 的生产形态只能在测试台里验"的原因。
    acpFaceEnabled: true
